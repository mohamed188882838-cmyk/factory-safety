<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supervisor Login</title>

  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>
<body>

  <!-- Background Shapes -->
  <div class="bg-shield top"></div>
  <div class="bg-shield bottom"></div>

  <div class="container">

    <!-- Logo -->
    <div class="logo-box">
      <div class="logo">
        <i class="fa-solid fa-shield-halved"></i>
      </div>

      <h1>Supervisor Login</h1>
      <p>Access your industrial safety dashboard</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">

      <div class="input-group">
        <label>Email Address</label>

        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="supervisor@factory.com">
        </div>
      </div>

      <div class="input-group">
        <div class="label-row">
          <label>Password</label>
          <a href="#">Forgot Password?</a>
        </div>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="password"
            placeholder="••••••••"
          >

          <i
            class="fa-regular fa-eye eye"
            id="togglePassword"
          ></i>
        </div>
      </div>

      <div class="remember">
        <input type="checkbox" id="remember">
        <label for="remember">Remember this device for 30 days</label>
      </div>

      <button class="login-btn">
        Sign In to Supervisor Console
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <div class="divider"></div>

      <p class="signup-text">
        New to the platform?
        <a href="#">Create an account</a>
      </p>

    </div>

    <!-- Footer -->
    <div class="footer">
      <span>COMPLIANCE VERIFIED SYSTEM</span>

      <div class="footer-icons">
        <div class="small-icon"></div>
        <div class="small-icon active"></div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
